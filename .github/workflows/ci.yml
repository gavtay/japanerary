name: Deploy to AWS S3 and CloudFront

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build Astro site
      - name: Build site
        run: npm run build

      # Prettier formatting check
      - name: Prettier check
        run: npx prettier --write "**/*.{js,ts,astro,css,html,json,md}" 

      # ESLint check
      - name: ESLint check
        run: npx eslint . --ext .js,.ts,.astro

      # TypeScript type check
      - name: TypeScript check
        run: npx tsc --noEmit

      # Accessibility check with Pa11y
      - name: Accessibility check
        run: |
          if compgen -G "dist/*.html" > /dev/null; then
            for file in dist/*.html; do
              echo "Running Pa11y on $file"
              npx pa11y "file://$PWD/$file" --config pa11y.config.cjs
            done
          else
            echo "No HTML files found in dist/, skipping Pa11y."
          fi
      
      # Allow Deploy job to be able to have access to files
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: ./dist

  deployment:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      # Access files from the upload build artifact step in build-and-test job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: ./dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Deploy to S3 with proper content types
      - name: Deploy to S3
        run: |
          # Sync SVG files with correct content type
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.svg" \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=31536000" \
            --delete
          
          # Sync other image files
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.webp" \
            --include "*.ico" \
            --cache-control "public, max-age=31536000" \
            --delete
          
          # Sync CSS and JS files
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.css" \
            --include "*.js" \
            --cache-control "public, max-age=31536000" \
            --delete
          
          # Sync HTML files with no cache
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete
          
          # Sync everything else
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*.svg" \
            --exclude "*.png" \
            --exclude "*.jpg" \
            --exclude "*.jpeg" \
            --exclude "*.gif" \
            --exclude "*.webp" \
            --exclude "*.ico" \
            --exclude "*.css" \
            --exclude "*.js" \
            --exclude "*.html" \
            --delete

      # Ensures users see the newest project version immediately upon deployment
      - name: Invalidate Cloudfront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
